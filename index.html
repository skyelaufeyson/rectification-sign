<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tandatangan Digital Kontraktor</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333333;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .header {
      padding: 12px 16px 6px;
      text-align: center;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
    }
    .header p {
      font-size: 12px;
      color: #64748b;
      margin-top: 2px;
    }
    /* Debug Bar */
    .debug-bar {
      background: #0f172a;
      color: #38bdf8;
      font-family: monospace;
      font-size: 11px;
      padding: 4px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .debug-status {
      color: #4ade80;
      font-weight: bold;
    }
    .canvas-container {
      flex: 1;
      position: relative;
      margin: 8px 10px;
      background: #ffffff;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    .baseline {
      position: absolute;
      bottom: 30px;
      left: 20px;
      right: 20px;
      border-bottom: 1px dashed #94a3b8;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
      font-size: 11px;
      padding-bottom: 4px;
    }
    .footer {
      padding: 10px 14px 14px;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    .btn {
      flex: 1;
      padding: 13px 10px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease, transform 0.05s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-clear {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
    }
    .btn-submit {
      background: #92D050;
      color: #0f3d0f;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    /* Toast Alert */
    #toast {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      padding: 16px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      z-index: 999;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>✍️ Tandatangan Kontraktor</h1>
    <p>Sila tandatangan menggunakan jari di dalam kotak</p>
  </div>

  <!-- Live Debug Info Bar -->
  <div class="debug-bar">
    <span id="dbgInfo">Titik: 0 | Saiz: 0 B</span>
    <span class="debug-status" id="dbgStatus">● Sedia (V2 Vektor)</span>
  </div>

  <div class="canvas-container" id="container">
    <canvas id="sigPad"></canvas>
    <div class="baseline">
      <span>✕ Tandatangan di sini</span>
      <span>Prepared By</span>
    </div>
  </div>

  <div class="footer">
    <button class="btn btn-clear" id="btnClear" type="button">
      🔄 Padam
    </button>
    <button class="btn btn-submit" id="btnSubmit" type="button">
      ✅ Sahkan Tandatangan
    </button>
  </div>

  <div id="toast"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.enableClosingConfirmation(); } catch (e) {}
    }

    const canvas = document.getElementById('sigPad');
    const container = document.getElementById('container');
    const dbgInfo = document.getElementById('dbgInfo');
    const dbgStatus = document.getElementById('dbgStatus');
    const toast = document.getElementById('toast');
    const ctx = canvas.getContext('2d');
    
    let isDrawing = false;
    let strokes = []; // [ [ [x, y], ... ], ... ]
    let currentStroke = [];
    let lastX = 0;
    let lastY = 0;
    let totalPoints = 0;

    function showToast(msg, duration = 2500) {
      toast.innerText = msg;
      toast.style.display = 'block';
      if (duration > 0) {
        setTimeout(() => { toast.style.display = 'none'; }, duration);
      }
    }

    function updateDebugStats() {
      totalPoints = strokes.reduce((acc, s) => acc + s.length, 0) + currentStroke.length;
      const roughBytes = totalPoints * 7 + strokes.length * 10;
      dbgInfo.innerText = `Titik: ${totalPoints} | Saiz: ~${roughBytes} B / 4096 B`;
      if (roughBytes > 3800) {
        dbgStatus.style.color = '#f87171';
        dbgStatus.innerText = '● Had Maksimum';
      } else {
        dbgStatus.style.color = '#4ade80';
        dbgStatus.innerText = '● Sedia';
      }
    }

    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 3.0;
      ctx.strokeStyle = '#000000';

      redrawAllStrokes();
    }

    function redrawAllStrokes() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const stroke of strokes) {
        if (!stroke || stroke.length === 0) continue;
        if (stroke.length === 1) {
          ctx.beginPath();
          ctx.arc(stroke[0][0], stroke[0][1], 1.5, 0, Math.PI * 2);
          ctx.fillStyle = '#000000';
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.moveTo(stroke[0][0], stroke[0][1]);
          for (let i = 1; i < stroke.length; i++) {
            const midX = (stroke[i - 1][0] + stroke[i][0]) / 2;
            const midY = (stroke[i - 1][1] + stroke[i][1]) / 2;
            ctx.quadraticCurveTo(stroke[i - 1][0], stroke[i - 1][1], midX, midY);
          }
          ctx.lineTo(stroke[stroke.length - 1][0], stroke[stroke.length - 1][1]);
          ctx.stroke();
        }
      }
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 150));
    resizeCanvas();

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: Math.round(clientX - rect.left),
        y: Math.round(clientY - rect.top)
      };
    }

    function startDrawing(e) {
      e.preventDefault();
      isDrawing = true;
      const pos = getCoords(e);
      lastX = pos.x;
      lastY = pos.y;
      
      currentStroke = [[lastX, lastY]];

      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(lastX + 0.1, lastY + 0.1);
      ctx.stroke();
      updateDebugStats();
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getCoords(e);
      
      const dx = pos.x - lastX;
      const dy = pos.y - lastY;
      if (dx * dx + dy * dy < 4) return; // filter jitter

      const midX = (lastX + pos.x) / 2;
      const midY = (lastY + pos.y) / 2;

      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.quadraticCurveTo(lastX, lastY, midX, midY);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();

      lastX = pos.x;
      lastY = pos.y;
      currentStroke.push([lastX, lastY]);
      updateDebugStats();
    }

    function stopDrawing(e) {
      if (!isDrawing) return;
      isDrawing = false;
      if (currentStroke.length > 0) {
        strokes.push(currentStroke);
        currentStroke = [];
      }
      updateDebugStats();
    }

    // Touch events
    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDrawing, { passive: false });
    canvas.addEventListener('touchcancel', stopDrawing, { passive: false });

    // Mouse events
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    // Clear Button
    document.getElementById('btnClear').addEventListener('click', () => {
      strokes = [];
      currentStroke = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      updateDebugStats();
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }
    });

    // Submit Button
    const btnSubmit = document.getElementById('btnSubmit');
    btnSubmit.addEventListener('click', () => {
      if (strokes.length === 0) {
        alert('Sila tandatangan terlebih dahulu sebelum tekan Sahkan.');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerText = '⏳ Menghantar...';

      // Build compact JSON payload
      let simplified = strokes.map(s => s.map(pt => [Math.round(pt[0]), Math.round(pt[1])]));
      let payload = JSON.stringify({ s: simplified });

      // Downsample if payload exceeds safe margin
      let step = 2;
      while (payload.length > 3600 && step < 8) {
        simplified = strokes.map(s => {
          if (s.length <= 2) return s;
          const r = [s[0]];
          for (let i = 1; i < s.length - 1; i += step) {
            r.push([Math.round(s[i][0]), Math.round(s[i][1])]);
          }
          r.push(s[s.length - 1]);
          return r;
        });
        payload = JSON.stringify({ s: simplified });
        step++;
      }

      const byteSize = new Blob([payload]).size;
      showToast(`🚀 Menghantar ${byteSize} bytes ke bot...`, 0);

      if (tg?.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }

      if (tg && tg.sendData) {
        try {
          // Send to bot
          tg.sendData(payload);
          setTimeout(() => {
            try { tg.close(); } catch(e) {}
          }, 300);
        } catch (err) {
          showToast(`❌ Ralat: ${err.message}`, 4000);
          btnSubmit.disabled = false;
          btnSubmit.innerText = '✅ Sahkan Tandatangan';
        }
      } else {
        showToast(`✅ Data ${byteSize} bytes sedia. Buka melalui Telegram untuk menghantar.`, 4000);
        btnSubmit.disabled = false;
        btnSubmit.innerText = '✅ Sahkan Tandatangan';
      }
    });
  </script>
</body>
</html>
